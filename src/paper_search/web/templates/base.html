<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paper Search{% endblock %}</title>
  <style>
    :root {
      --bg: #fbfbfa; --panel: #fff; --ink: #1a1a19; --muted: #6b6b68;
      --line: #e3e3e0; --accent: #7a5cff; --ok: #1f8a52; --warn: #a8620a;
      --chip: #f0eefc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171a; --panel: #1f1f23; --ink: #ececeb; --muted: #9c9c98;
        --line: #32323a; --accent: #a68cff; --ok: #4cc38a; --warn: #e0a458;
        --chip: #2a2640;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.6 -apple-system, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }
    header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
    header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
    header a { color: var(--muted); text-decoration: none; font-size: 13px; }
    header a:hover { color: var(--accent); }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 20px; margin-bottom: 16px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type=text], input[type=date], input[type=number], textarea {
      width: 100%; padding: 9px 11px; border: 1px solid var(--line);
      border-radius: 7px; background: var(--bg); color: var(--ink); font: inherit;
    }
    textarea { resize: vertical; min-height: 62px; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .row > div { flex: 1 1 180px; }
    .field { margin-bottom: 14px; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 7px;
      padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    button:hover { filter: brightness(1.08); }
    .muted { color: var(--muted); font-size: 13px; }
    .warn {
      border-left: 3px solid var(--warn); background: var(--panel);
      padding: 10px 14px; border-radius: 0 7px 7px 0; margin-bottom: 8px; font-size: 14px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    .chip {
      display: inline-block; background: var(--chip); color: var(--accent);
      border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 600;
      vertical-align: middle;
    }
    .chip.grey { background: var(--line); color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><a href="/" style="color:inherit;text-decoration:none">Paper Search</a></h1>
      <span class="muted">신규 논문 스크리닝</span>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
